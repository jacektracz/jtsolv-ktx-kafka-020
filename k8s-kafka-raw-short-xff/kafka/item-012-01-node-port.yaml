  name: kafka-xff-nodeport
  namespace: kafka-xff-nm
  labels:
    app: kafka-xff-app
spec:
  type: NodePort
  selector:
    app: kafka-xff-app
  ports:

    - name: external
      port: 9094
      nodePort: 30092
      protocol: TCP

