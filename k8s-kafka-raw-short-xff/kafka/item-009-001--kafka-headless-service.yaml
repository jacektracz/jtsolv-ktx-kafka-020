apiVersion: v1
kind: Service
metadata:
  labels:
    app: kafka-xff-app
  name: kafka-xff-headless-service
  namespace: kafka-xff-nm
spec:
  clusterIP: None
  clusterIPs:
  - None
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: tcp-kafka-int
    port: 9092
    protocol: TCP
    targetPort: tcp-kafka-int
  - name: tcp-kafka-ctrl
    port: 9093
    protocol: TCP
    targetPort: tcp-kafka-ctrl
  selector:
    app: kafka-xff-app
  sessionAffinity: None
  type: ClusterIP
