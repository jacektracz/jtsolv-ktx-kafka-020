apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability-xuu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: localhost:32000/jtsolv-kafka-otel:0.0.10
          args: ["--config=/conf/otel-config.yaml"]
          volumeMounts:
            - name: otel-config-vol
              mountPath: /conf
            - name: otel-temp-vol
              mountPath: /tmp
      volumes:
        - name: otel-config-vol
          configMap:
            name: otel-collector-config
        - name: otel-temp-vol
          emptyDir: {}
