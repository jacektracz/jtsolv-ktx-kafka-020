apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-config.yaml: |
    receivers:
      jmx/kafka:
        jar_path: /otel/jmx-metrics.jar
        endpoint: service:jmx:rmi:///jndi/rmi://kafka.observability.svc.cluster.local:9999/jmxrmi
        target_system: kafka
        collection_interval: 30s

    processors:
      batch: {}

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9464"
      logging:
        loglevel: debug
      jaeger:
        endpoint: "jaeger-collector.observability:14250"
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [jmx/kafka]
          processors: [batch]
          exporters: [prometheus, logging]
        traces:
          receivers: []
          processors: []
          exporters: [jaeger]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.79.0
          args: ["--config=/conf/otel-config.yaml"]
          volumeMounts:
            - name: otel-config-vol
              mountPath: /conf
      volumes:
        - name: otel-config-vol
          configMap:
            name: otel-collector-config
